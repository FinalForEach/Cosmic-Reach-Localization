name: Validate JSON Files

on:
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Cosmic-Reach-Localization/assets/base/scripts/requirements.txt

      - name: Validate JSON files
        run: python Cosmic-Reach-Localization/assets/base/scripts/validate_json.py Cosmic-Reach-Localization/assets/base/lang/ --github
